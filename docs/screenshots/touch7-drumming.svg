<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 800 480" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/><stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <style>
      .txt{fill:#e6edf3}.muted{fill:#8b97a7}.accent{fill:#4cc2ff}
      .panel{fill:#1a1f29;stroke:#2b3340;stroke-width:1}
      .panel2{fill:#232a36;stroke:#323b4a;stroke-width:1}
      .field{fill:#161b23;stroke:#323b4a;stroke-width:1}
      .lbl{fill:#8b97a7;font-size:11px;letter-spacing:.5px}
      .row{fill:#cdd7e2;font-size:14px}.mono{font-family:monospace}
    </style>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>

  <rect x="0" y="0" width="800" height="52" fill="#141922"/>
  <text x="20" y="33" class="accent" font-size="18" font-weight="700">DRUMMING</text>
  <text x="784" y="33" text-anchor="end" class="accent" font-size="15" font-weight="700">Studio Maple</text>
  <rect x="560" y="14" width="150" height="26" rx="6" fill="#143040" stroke="#4cc2ff"/><text x="635" y="32" text-anchor="middle" class="accent" font-size="12">Roland TD ▾</text>

  <!-- kit summary -->
  <g transform="translate(20,64)">
    <rect class="panel" x="0" y="0" width="360" height="250" rx="12"/>
    <text x="18" y="28" class="lbl">KIT SUMMARY · drums.sf2 · ch 10</text>
    <text x="18" y="62" class="row">Pieces mapped</text><text x="342" y="62" text-anchor="end" class="accent" font-size="16" font-weight="700">17</text>
    <text x="18" y="92" class="row">Velocity layers</text><text x="342" y="92" text-anchor="end" class="accent" font-size="16" font-weight="700">up to 8</text>
    <line x1="18" y1="108" x2="342" y2="108" stroke="#2b3340"/>
    <text x="18" y="136" class="row">Kick · Snare · Rim · X-Stick</text>
    <text x="18" y="164" class="row">Toms 1/2/3 + rims</text>
    <text x="18" y="192" class="row">HH Open / Closed / Pedal</text>
    <text x="18" y="220" class="row">Crash 1/2 · Ride bow/edge/bell</text>
  </g>

  <!-- mapping table -->
  <g transform="translate(396,64)">
    <rect class="panel" x="0" y="0" width="384" height="250" rx="12"/>
    <text x="18" y="28" class="lbl">MIDI MAPPING</text>
    <g font-size="14">
      <text x="18" y="60" class="row">Kick</text><text x="366" y="60" text-anchor="end" class="accent mono">36</text>
      <text x="18" y="90" class="row">Snare / Rim / X-Stick</text><text x="366" y="90" text-anchor="end" class="accent mono">38 / 40 / 37</text>
      <text x="18" y="120" class="row">HH Closed / Open / Pedal</text><text x="366" y="120" text-anchor="end" class="accent mono">42 / 46 / 44</text>
      <text x="18" y="150" class="row">Toms 1 / 2 / 3</text><text x="366" y="150" text-anchor="end" class="accent mono">48 / 45 / 43</text>
      <text x="18" y="180" class="row">Crash 1 / 2</text><text x="366" y="180" text-anchor="end" class="accent mono">49 / 57</text>
      <text x="18" y="210" class="row">Ride Bow / Bell</text><text x="366" y="210" text-anchor="end" class="accent mono">51 / 53</text>
    </g>
  </g>

  <!-- MP3 player -->
  <g transform="translate(20,330)">
    <rect class="panel" x="0" y="0" width="760" height="132" rx="12"/>
    <text x="20" y="30" class="lbl">BACKING TRACK — Funk Groove · 96 BPM</text>
    <g transform="translate(60,86)"><circle r="30" fill="#143040" stroke="#4cc2ff" stroke-width="2"/><polygon points="-10,-15 -10,15 18,0" fill="#4cc2ff"/></g>
    <g transform="translate(140,86)"><circle r="26" class="panel2"/><rect x="-8" y="-9" width="16" height="18" rx="2" fill="#cdd7e2"/></g>
    <g transform="translate(216,86)"><circle r="26" fill="#143040" stroke="#4cc2ff"/><path d="M -11 -5 a 10 10 0 1 1 -1 9" fill="none" stroke="#4cc2ff" stroke-width="3"/></g>
    <text x="60" y="52" text-anchor="middle" class="lbl">PLAY</text><text x="140" y="52" text-anchor="middle" class="lbl">STOP</text><text x="216" y="52" text-anchor="middle" class="accent" font-size="12">LOOP</text>
    <rect x="280" y="78" width="420" height="14" rx="7" fill="#222a35"/><rect x="280" y="78" width="170" height="14" rx="7" fill="#4cc2ff"/>
    <circle cx="450" cy="85" r="9" fill="#e6edf3"/>
    <text x="280" y="116" class="muted mono" font-size="12">01:12</text><text x="700" y="116" text-anchor="end" class="muted mono" font-size="12">02:48</text>
  </g>
</svg>
