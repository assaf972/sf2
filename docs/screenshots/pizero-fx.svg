<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 480 320" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .scr { fill:#0b0e13; } .txt { fill:#e6edf3; } .muted { fill:#7f8b9b; }
      .accent { fill:#4cc2ff; } .lbl { fill:#7f8b9b; font-size:9px; letter-spacing:.5px; }
      .btn { fill:#232a36; stroke:#323b4a; }
      .kv { fill:#e6edf3; font-size:11px; font-weight:700; } .kl { fill:#9aa6b6; font-size:9px; }
    </style>
  </defs>
  <rect x="0" y="0" width="480" height="320" rx="10" fill="#000"/>
  <rect x="4" y="4" width="472" height="312" rx="7" class="scr"/>

  <rect x="4" y="4" width="472" height="26" rx="7" fill="#11151c"/><rect x="4" y="16" width="472" height="14" fill="#11151c"/>
  <text x="14" y="22" class="accent" font-size="13" font-weight="700">GIGSYNTH</text>
  <text x="468" y="21" text-anchor="end" class="muted" font-size="10">FX · KEYBOARD 1</text>

  <!-- now editing banner -->
  <rect x="12" y="38" width="456" height="40" rx="8" fill="#161b23" stroke="#2b3340"/>
  <text x="24" y="55" class="lbl">EFFECTS — INSERT CHAIN</text>
  <text x="24" y="71" class="accent" font-size="15" font-weight="700">Fender Rhodes</text>
  <text x="456" y="63" text-anchor="end" class="muted" font-size="10">Part 5 · Rhodes Verse</text>

  <!-- CHORUS group -->
  <rect x="12" y="88" width="456" height="74" rx="8" fill="#11161e" stroke="#2b3340"/>
  <text x="26" y="112" class="txt" font-size="13" font-weight="700">CHORUS</text>
  <rect x="26" y="122" width="44" height="18" rx="9" fill="#143040" stroke="#4cc2ff"/><text x="48" y="135" text-anchor="middle" class="accent" font-size="10">On</text>
  <text x="26" y="156" class="muted" font-size="9">2 params</text>
  <g transform="translate(330,125)"><circle r="20" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.2 31.4" transform="rotate(135)"/><circle r="20" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="37.7 125.7" transform="rotate(135)"/><circle r="12" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">0.8</text><text y="30" text-anchor="middle" class="kl">RATE Hz</text></g>
  <g transform="translate(414,125)"><circle r="20" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.2 31.4" transform="rotate(135)"/><circle r="20" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="51.8 125.7" transform="rotate(135)"/><circle r="12" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">55</text><text y="30" text-anchor="middle" class="kl">DEPTH</text></g>

  <!-- DELAY group (encoders active) -->
  <rect x="12" y="170" width="456" height="86" rx="8" fill="#0e1b24" stroke="#4cc2ff"/>
  <text x="26" y="194" class="txt" font-size="13" font-weight="700">DELAY</text>
  <rect x="26" y="204" width="44" height="18" rx="9" fill="#143040" stroke="#4cc2ff"/><text x="48" y="217" text-anchor="middle" class="accent" font-size="10">On</text>
  <rect x="26" y="228" width="64" height="16" rx="8" fill="#4cc2ff" opacity="0.18" stroke="#4cc2ff"/><text x="58" y="240" text-anchor="middle" class="accent" font-size="9">◀ ENCODERS</text>
  <g transform="translate(250,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="46.6 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">320</text><text y="34" text-anchor="middle" class="kl">TIME ms</text></g>
  <g transform="translate(345,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="36.3 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">35</text><text y="34" text-anchor="middle" class="kl">FEEDBACK</text></g>
  <g transform="translate(440,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="31.1 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">30</text><text y="34" text-anchor="middle" class="kl">MIX</text></g>

  <!-- footer -->
  <rect class="btn" x="12" y="266" width="120" height="26" rx="6"/><text x="72" y="283" text-anchor="middle" class="txt" font-size="11">◀ Back / Home</text>
  <rect class="btn" x="140" y="266" width="120" height="26" rx="6"/><text x="200" y="283" text-anchor="middle" class="txt" font-size="11">FX: Chorus ⇄ Delay</text>
  <text x="468" y="283" text-anchor="end" class="muted" font-size="9">4 encoders address the highlighted effect</text>
</svg>
