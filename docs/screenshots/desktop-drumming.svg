<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/><stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <style>
      .panel{fill:#1a1f29;stroke:#2b3340;stroke-width:1}
      .panel2{fill:#232a36;stroke:#323b4a;stroke-width:1}
      .txt{fill:#e6edf3}.muted{fill:#8b97a7}.accent{fill:#4cc2ff}
      .lbl{fill:#8b97a7;font-size:12px}.big{fill:#e6edf3;font-size:20px;font-weight:600}
      .h{fill:#cdd7e2;font-size:14px;font-weight:600}.num{fill:#4cc2ff;font-size:13px;font-weight:600}
      .row{fill:#cdd7e2;font-size:13px}.mono{font-family:monospace}
      .ghdr{fill:#cdd7e2;font-size:11px;font-weight:600;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>

  <!-- Title bar + tabs -->
  <rect x="0" y="0" width="1280" height="36" fill="#0a0d12"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="640" y="23" text-anchor="middle" class="muted" font-size="13">GigSynth — Drum Module</text>
  <rect x="0" y="36" width="1280" height="44" fill="#141922"/>
  <text x="72" y="63" text-anchor="middle" class="muted" font-size="14">Live</text>
  <text x="170" y="63" text-anchor="middle" class="muted" font-size="14">Songs</text>
  <rect x="232" y="48" width="118" height="22" rx="4" fill="#4cc2ff" opacity="0.16"/>
  <text x="291" y="63" text-anchor="middle" class="accent" font-size="14" font-weight="600">Drumming</text>
  <text x="408" y="63" text-anchor="middle" class="muted" font-size="14">Guitar Rig</text>
  <text x="520" y="63" text-anchor="middle" class="muted" font-size="14">Settings</text>
  <rect x="0" y="79" width="1280" height="1" fill="#2b3340"/>

  <!-- Header / context -->
  <g transform="translate(24,96)">
    <rect class="panel" x="0" y="0" width="1232" height="64" rx="10"/>
    <rect x="0" y="0" width="1232" height="64" rx="10" fill="#202734"/>
    <circle cx="26" cy="32" r="6" fill="#27c93f"/>
    <text x="44" y="29" class="h" font-size="16">Drum Kit — Studio Maple</text>
    <text x="44" y="50" class="muted" font-size="12">drums.sf2 · multi-velocity · channel 10</text>
    <text x="640" y="26" class="lbl">MAPPING PRESET</text>
    <rect x="640" y="34" width="180" height="22" rx="6" fill="#143040" stroke="#4cc2ff"/>
    <text x="654" y="50" class="accent" font-size="13">Roland TD ▾</text>
    <text x="1212" y="29" text-anchor="end" class="muted" font-size="12">INPUT</text>
    <text x="1212" y="50" text-anchor="end" class="accent" font-size="13" font-weight="600">TD-17 · USB-MIDI</text>
  </g>

  <!-- LEFT: Kit summary -->
  <g transform="translate(24,176)">
    <rect class="panel" x="0" y="0" width="360" height="556" rx="12"/>
    <text x="20" y="34" class="ghdr">KIT SUMMARY</text>
    <line x1="20" y1="46" x2="340" y2="46" stroke="#2b3340"/>
    <text x="20" y="74" class="lbl">PIECES MAPPED</text><text x="340" y="74" text-anchor="end" class="num" font-size="18">17</text>
    <text x="20" y="104" class="lbl">VELOCITY LAYERS</text><text x="340" y="104" text-anchor="end" class="num" font-size="18">up to 8</text>
    <line x1="20" y1="124" x2="340" y2="124" stroke="#2b3340"/>
    <!-- piece chips -->
    <g font-size="12">
      <g transform="translate(20,150)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">Kick</text><text x="138" y="21" text-anchor="end" class="muted">8</text></g>
      <g transform="translate(190,150)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">Snare</text><text x="138" y="21" text-anchor="end" class="muted">8</text></g>
      <g transform="translate(20,194)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">Snare Rim</text><text x="138" y="21" text-anchor="end" class="muted">4</text></g>
      <g transform="translate(190,194)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">X-Stick</text><text x="138" y="21" text-anchor="end" class="muted">2</text></g>
      <g transform="translate(20,238)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">Tom 1 / 2 / 3</text><text x="138" y="21" text-anchor="end" class="muted">6</text></g>
      <g transform="translate(190,238)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">HH O/C/Pedal</text><text x="138" y="21" text-anchor="end" class="muted">6</text></g>
      <g transform="translate(20,282)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">Crash 1 / 2</text><text x="138" y="21" text-anchor="end" class="muted">4</text></g>
      <g transform="translate(190,282)"><rect width="150" height="34" rx="8" class="panel2"/><circle cx="18" cy="17" r="5" fill="#27c93f"/><text x="34" y="21" class="row">Ride B/E/Bell</text><text x="138" y="21" text-anchor="end" class="muted">6</text></g>
    </g>
    <line x1="20" y1="336" x2="340" y2="336" stroke="#2b3340"/>
    <text x="20" y="364" class="lbl">HI-HAT CONTROLLER</text>
    <text x="340" y="364" text-anchor="end" class="row">CC4 (foot)</text>
    <text x="20" y="392" class="lbl">DRUM CHANNEL</text>
    <text x="340" y="392" text-anchor="end" class="row">10</text>
    <text x="20" y="420" class="lbl">FOLD RULES</text>
    <text x="340" y="420" text-anchor="end" class="row">26→46 · 22→42</text>
    <!-- mini velocity meter -->
    <text x="20" y="462" class="lbl">LAST HIT — SNARE · vel 96</text>
    <rect x="20" y="474" width="320" height="14" rx="7" fill="#222a35"/>
    <rect x="20" y="474" width="240" height="14" rx="7" fill="#4cc2ff"/>
    <text x="20" y="520" class="lbl">KIT FILE</text>
    <text x="20" y="540" class="row mono" font-size="11">~/Sounds/drums.sf2</text>
  </g>

  <!-- MIDDLE: MIDI mapping table -->
  <g transform="translate(400,176)">
    <rect class="panel" x="0" y="0" width="520" height="556" rx="12"/>
    <text x="20" y="34" class="ghdr">MIDI MAPPING · Roland TD preset</text>
    <line x1="20" y1="46" x2="500" y2="46" stroke="#2b3340"/>
    <!-- column heads -->
    <text x="20" y="72" class="lbl">PAD / ZONE</text>
    <text x="300" y="72" text-anchor="middle" class="lbl">NOTE</text>
    <text x="490" y="72" text-anchor="end" class="lbl">SF2 VOICE</text>
    <line x1="20" y1="82" x2="500" y2="82" stroke="#202734"/>
    <g font-size="13">
      <!-- rows -->
      <g transform="translate(0,86)"><text x="20" y="20" class="row">Kick</text><text x="300" y="20" text-anchor="middle" class="num mono">36</text><text x="490" y="20" text-anchor="end" class="row">Bass Drum 1</text></g>
      <g transform="translate(0,118)"><rect x="12" y="0" width="488" height="30" rx="6" fill="#151a22"/><text x="20" y="20" class="row">Snare Head</text><text x="300" y="20" text-anchor="middle" class="num mono">38</text><text x="490" y="20" text-anchor="end" class="row">Acoustic Snare</text></g>
      <g transform="translate(0,150)"><text x="20" y="20" class="row">Snare Rim</text><text x="300" y="20" text-anchor="middle" class="num mono">40</text><text x="490" y="20" text-anchor="end" class="row">Electric Snare</text></g>
      <g transform="translate(0,182)"><rect x="12" y="0" width="488" height="30" rx="6" fill="#151a22"/><text x="20" y="20" class="row">Snare X-Stick</text><text x="300" y="20" text-anchor="middle" class="num mono">37</text><text x="490" y="20" text-anchor="end" class="row">Side Stick</text></g>
      <g transform="translate(0,214)"><text x="20" y="20" class="row">Tom 1 / Rim</text><text x="300" y="20" text-anchor="middle" class="num mono">48 / 50</text><text x="490" y="20" text-anchor="end" class="row">Hi-Mid / High Tom</text></g>
      <g transform="translate(0,246)"><rect x="12" y="0" width="488" height="30" rx="6" fill="#151a22"/><text x="20" y="20" class="row">Tom 2 / Rim</text><text x="300" y="20" text-anchor="middle" class="num mono">45 / 47</text><text x="490" y="20" text-anchor="end" class="row">Low / Low-Mid Tom</text></g>
      <g transform="translate(0,278)"><text x="20" y="20" class="row">Tom 3 / Rim</text><text x="300" y="20" text-anchor="middle" class="num mono">43 / 58</text><text x="490" y="20" text-anchor="end" class="row">Hi Floor / Vibraslap</text></g>
      <g transform="translate(0,310)"><rect x="12" y="0" width="488" height="30" rx="6" fill="#151a22"/><text x="20" y="20" class="row">HH Closed / Open</text><text x="300" y="20" text-anchor="middle" class="num mono">42 / 46</text><text x="490" y="20" text-anchor="end" class="row">Closed / Open HH</text></g>
      <g transform="translate(0,342)"><text x="20" y="20" class="row">HH Pedal</text><text x="300" y="20" text-anchor="middle" class="num mono">44</text><text x="490" y="20" text-anchor="end" class="row">Pedal Hi-Hat</text></g>
      <g transform="translate(0,374)"><rect x="12" y="0" width="488" height="30" rx="6" fill="#151a22"/><text x="20" y="20" class="row">HH Edge (O/C)</text><text x="300" y="20" text-anchor="middle" class="num mono">26 / 22*</text><text x="490" y="20" text-anchor="end" class="muted">→ 46 / 42</text></g>
      <g transform="translate(0,406)"><text x="20" y="20" class="row">Crash 1 Bow / Edge</text><text x="300" y="20" text-anchor="middle" class="num mono">49 / 55</text><text x="490" y="20" text-anchor="end" class="row">Crash 1 / Splash</text></g>
      <g transform="translate(0,438)"><rect x="12" y="0" width="488" height="30" rx="6" fill="#151a22"/><text x="20" y="20" class="row">Ride Bow / Bell</text><text x="300" y="20" text-anchor="middle" class="num mono">51 / 53</text><text x="490" y="20" text-anchor="end" class="row">Ride 1 / Ride Bell</text></g>
    </g>
    <text x="20" y="540" class="muted" font-size="11">* out-of-range notes folded onto an audible voice</text>
  </g>

  <!-- RIGHT: MP3 backing player -->
  <g transform="translate(936,176)">
    <rect class="panel" x="0" y="0" width="320" height="556" rx="12"/>
    <text x="20" y="34" class="ghdr">BACKING TRACK</text>
    <line x1="20" y1="46" x2="300" y2="46" stroke="#2b3340"/>
    <rect x="20" y="64" width="280" height="64" rx="10" class="panel2"/>
    <text x="36" y="92" class="big" font-size="16">Funk Groove 96 BPM</text>
    <text x="36" y="114" class="muted" font-size="12">backing-tracks/funk-96.mp3</text>
    <!-- transport -->
    <g transform="translate(160,210)">
      <circle r="46" fill="#143040" stroke="#4cc2ff" stroke-width="2"/>
      <polygon points="-14,-22 -14,22 24,0" fill="#4cc2ff"/>
    </g>
    <g transform="translate(60,300)">
      <rect x="-34" y="-22" width="68" height="44" rx="10" class="panel2"/>
      <rect x="-10" y="-12" width="20" height="24" rx="3" fill="#cdd7e2"/>
      <text x="0" y="44" text-anchor="middle" class="lbl">STOP</text>
    </g>
    <g transform="translate(160,300)">
      <rect x="-34" y="-22" width="68" height="44" rx="10" fill="#143040" stroke="#4cc2ff"/>
      <path d="M -16 -6 a 14 14 0 1 1 -2 12" fill="none" stroke="#4cc2ff" stroke-width="3"/>
      <polygon points="-18,4 -10,-4 -22,-8" fill="#4cc2ff"/>
      <text x="0" y="44" text-anchor="middle" class="accent">LOOP</text>
    </g>
    <g transform="translate(260,300)">
      <rect x="-34" y="-22" width="68" height="44" rx="10" class="panel2"/>
      <text x="0" y="6" text-anchor="middle" class="row" font-size="18">⟲</text>
      <text x="0" y="44" text-anchor="middle" class="lbl">RESTART</text>
    </g>
    <!-- position -->
    <text x="20" y="400" class="lbl">POSITION</text>
    <rect x="20" y="412" width="280" height="10" rx="5" fill="#222a35"/>
    <rect x="20" y="412" width="120" height="10" rx="5" fill="#4cc2ff"/>
    <circle cx="140" cy="417" r="8" fill="#e6edf3"/>
    <text x="20" y="444" class="muted mono" font-size="12">01:12</text>
    <text x="300" y="444" text-anchor="end" class="muted mono" font-size="12">02:48</text>
    <!-- volume -->
    <text x="20" y="492" class="lbl">TRACK VOLUME</text>
    <rect x="20" y="504" width="280" height="10" rx="5" fill="#222a35"/>
    <rect x="20" y="504" width="210" height="10" rx="5" fill="#4cc2ff"/>
    <text x="20" y="540" class="muted" font-size="11">Loop a section to drill a fill or groove.</text>
  </g>
</svg>
