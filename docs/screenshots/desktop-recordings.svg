      <g transform="translate(28,72)" fill="#8b97a7" opacity="0.6">
        <rect x="0" y="12" width="2" height="12"/><rect x="5" y="9" width="2" height="18"/><rect x="10" y="14" width="2" height="8"/><rect x="15" y="6" width="2" height="24"/><rect x="20" y="11" width="2" height="14"/><rect x="25" y="13" width="2" height="10"/><rect x="30" y="8" width="2" height="20"/><rect x="35" y="10" width="2" height="16"/><rect x="40" y="5" width="2" height="26"/><rect x="45" y="13" width="2" height="10"/><rect x="50" y="9" width="2" height="18"/><rect x="55" y="7" width="2" height="22"/><rect x="60" y="12" width="2" height="12"/><rect x="65" y="10" width="2" height="16"/><rect x="70" y="14" width="2" height="8"/><rect x="75" y="8" width="2" height="20"/><rect x="80" y="11" width="2" height="14"/><rect x="85" y="13" width="2" height="10"/><rect x="90" y="9" width="2" height="18"/><rect x="95" y="12" width="2" height="12"/><rect x="100" y="7" width="2" height="22"/><rect x="105" y="13" width="2" height="10"/><rect x="110" y="10" width="2" height="16"/><rect x="115" y="14" width="2" height="8"/><rect x="120" y="8" width="2" height="20"/><rect x="125" y="11" width="2" height="14"/><rect x="130" y="13" width="2" height="10"/><rect x="135" y="9" width="2" height="18"/><rect x="140" y="12" width="2" height="12"/><rect x="145" y="10" width="2" height="16"/><rect x="150" y="13" width="2" height="10"/><rect x="155" y="11" width="2" height="14"/>
