      <circle cx="288" cy="6" r="5" fill="#e6edf3"/>
      <text x="14" y="206" class="muted" font-size="11">MIDI + audio aligned</text>
    </g>

    <!-- Track indicator -->
    <g transform="translate(20,328)">
      <rect class="panel2" x="0" y="0" width="608" height="56" rx="10"/>
      <circle cx="22" cy="28" r="6" fill="#4cc2ff"/><text x="38" y="33" class="txt" font-size="13">MIDI track</text>
      <text x="150" y="33" class="muted" font-size="12">7 channels · 12,488 events</text>
      <line x1="330" y1="14" x2="330" y2="42" stroke="#323b4a"/>
      <circle cx="352" cy="28" r="6" fill="#27c93f"/><text x="368" y="33" class="txt" font-size="13">Audio track</text>
      <text x="478" y="33" class="muted" font-size="12">stereo · 38.4 MB</text>
    </g>

    <!-- Transport -->
    <g transform="translate(20,408)">
      <rect class="panel2" x="0" y="0" width="608" height="100" rx="10"/>
      <!-- Play -->
