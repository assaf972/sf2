      <line x1="20" y1="110" x2="588" y2="110" stroke="#2b3340"/>
      <g transform="translate(20,12)" fill="#4cc2ff">
        <g opacity="0.85">
          <rect x="0" y="70" width="3" height="56"/><rect x="8" y="40" width="3" height="116"/><rect x="16" y="20" width="3" height="156"/><rect x="24" y="60" width="3" height="76"/><rect x="32" y="34" width="3" height="128"/><rect x="40" y="78" width="3" height="40"/><rect x="48" y="14" width="3" height="168"/><rect x="56" y="50" width="3" height="96"/><rect x="64" y="2" width="3" height="192"/><rect x="72" y="64" width="3" height="68"/><rect x="80" y="28" width="3" height="140"/><rect x="88" y="44" width="3" height="108"/><rect x="96" y="74" width="3" height="48"/><rect x="104" y="18" width="3" height="160"/><rect x="112" y="56" width="3" height="84"/><rect x="120" y="36" width="3" height="124"/><rect x="128" y="68" width="3" height="60"/><rect x="136" y="24" width="3" height="148"/><rect x="144" y="48" width="3" height="100"/><rect x="152" y="8" width="3" height="180"/><rect x="160" y="62" width="3" height="72"/><rect x="168" y="32" width="3" height="132"/><rect x="176" y="76" width="3" height="44"/><rect x="184" y="20" width="3" height="156"/><rect x="192" y="52" width="3" height="92"/><rect x="200" y="40" width="3" height="116"/><rect x="208" y="70" width="3" height="56"/><rect x="216" y="14" width="3" height="168"/><rect x="224" y="58" width="3" height="80"/><rect x="232" y="34" width="3" height="128"/><rect x="240" y="66" width="3" height="64"/>
