    <circle cx="520" cy="30" r="6" fill="#ff5f56"/><text x="582" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#ff8a8a">REC armed</text>
    <line x1="20" y1="68" x2="628" y2="68" stroke="#2b3340"/>

