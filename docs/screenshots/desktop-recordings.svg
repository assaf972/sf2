    <rect class="panel" x="0" y="0" width="648" height="668" rx="10"/>
    <text x="20" y="34" class="h" font-size="16">Soundcheck</text>
    <text x="20" y="54" class="muted" font-size="12">2026-06-04 · 14:07 · 44.1 kHz · stereo</text>
    <!-- armed REC chip -->
