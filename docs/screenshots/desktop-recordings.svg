<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/><stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <style>
      .panel{fill:#1a1f29;stroke:#2b3340;stroke-width:1}
      .panel2{fill:#232a36;stroke:#323b4a;stroke-width:1}
      .txt{fill:#e6edf3}.muted{fill:#8b97a7}.accent{fill:#4cc2ff}
      .lbl{fill:#8b97a7;font-size:12px}.big{fill:#e6edf3;font-size:20px;font-weight:600}
      .h{fill:#cdd7e2;font-size:14px;font-weight:600}.num{fill:#4cc2ff;font-size:13px;font-weight:600}
      .chip{font-size:10px;font-weight:600}
    </style>
  </defs>
  <rect width="1280" height="860" fill="url(#bg)"/>

  <!-- Title bar + tabs -->
  <rect x="0" y="0" width="1280" height="36" fill="#0a0d12"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="640" y="23" text-anchor="middle" class="muted" font-size="13">GigSynth — FluidSynth Live Rig</text>
  <rect x="0" y="36" width="1280" height="44" fill="#141922"/>
  <text x="72" y="63" text-anchor="middle" class="muted" font-size="14">Live</text>
  <text x="170" y="63" text-anchor="middle" class="muted" font-size="14">Songs</text>
  <text x="268" y="63" text-anchor="middle" class="muted" font-size="14">Settings</text>
  <rect x="360" y="48" width="120" height="22" rx="4" fill="#4cc2ff" opacity="0.16"/>
  <text x="420" y="63" text-anchor="middle" class="accent" font-size="14" font-weight="600">Recordings</text>
  <rect x="0" y="79" width="1280" height="1" fill="#2b3340"/>

