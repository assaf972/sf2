    <line x1="16" y1="68" x2="544" y2="68" stroke="#2b3340"/>

    <!-- Row 1 (selected) -->
    <g transform="translate(0,80)">
      <rect x="10" y="0" width="540" height="118" rx="8" fill="#4cc2ff" opacity="0.12"/>
      <rect x="10" y="0" width="540" height="118" rx="8" fill="none" stroke="#4cc2ff"/>
      <rect x="10" y="0" width="4" height="118" rx="2" fill="#4cc2ff"/>
      <text x="28" y="32" class="accent" font-size="16" font-weight="700">Soundcheck</text>
