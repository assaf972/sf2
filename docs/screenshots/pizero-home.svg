<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 480 320" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .scr { fill:#0b0e13; } .txt { fill:#e6edf3; } .muted { fill:#7f8b9b; }
      .accent { fill:#4cc2ff; } .lbl { fill:#7f8b9b; font-size:9px; letter-spacing:.5px; }
      .btn { fill:#232a36; stroke:#323b4a; } .btnA { fill:#143040; stroke:#4cc2ff; }
    </style>
  </defs>
  <!-- bezel -->
  <rect x="0" y="0" width="480" height="320" rx="10" fill="#000"/>
  <rect x="4" y="4" width="472" height="312" rx="7" class="scr"/>

  <!-- header -->
  <rect x="4" y="4" width="472" height="26" rx="7" fill="#11151c"/>
  <rect x="4" y="16" width="472" height="14" fill="#11151c"/>
  <text x="14" y="22" class="accent" font-size="13" font-weight="700">GIGSYNTH</text>
  <circle cx="392" cy="17" r="4" fill="#27c93f"/>
  <text x="402" y="21" class="muted" font-size="10">61-key</text>
  <text x="468" y="21" text-anchor="end" class="muted" font-size="10">HOME</text>

  <!-- now playing -->
  <rect x="12" y="38" width="456" height="104" rx="8" fill="#161b23" stroke="#2b3340"/>
  <text x="24" y="58" class="lbl">SONG  ·  PART 3 / 7</text>
  <text x="24" y="80" class="txt" font-size="17" font-weight="600">Shine On You Crazy Diamond</text>
  <line x1="24" y1="92" x2="456" y2="92" stroke="#2b3340"/>
  <text x="24" y="110" class="lbl">SOUND</text>
  <text x="24" y="132" class="accent" font-size="22" font-weight="700">Solina Pad</text>

  <!-- menu row 1 -->
  <g font-size="12">
    <rect class="btnA" x="12"  y="150" width="108" height="30" rx="6"/>
    <text x="66"  y="170" text-anchor="middle" class="accent" font-weight="600">Songs</text>
    <rect class="btn"  x="128" y="150" width="108" height="30" rx="6"/>
    <text x="182" y="170" text-anchor="middle" class="txt">Sounds</text>
    <rect class="btn"  x="244" y="150" width="108" height="30" rx="6"/>
    <text x="298" y="170" text-anchor="middle" class="txt">FX</text>
    <rect class="btn"  x="360" y="150" width="108" height="30" rx="6"/>
    <text x="414" y="170" text-anchor="middle" class="txt">Setup</text>
  </g>
  <!-- menu row 2 -->
  <g font-size="12">
    <rect class="btn" x="12"  y="186" width="224" height="30" rx="6"/>
    <text x="124" y="206" text-anchor="middle" class="txt">◀  Prev Part</text>
    <rect class="btn" x="244" y="186" width="224" height="30" rx="6"/>
    <text x="356" y="206" text-anchor="middle" class="txt">Next Part  ▶</text>
  </g>

  <!-- knob row -->
  <rect x="4" y="226" width="472" height="90" rx="7" fill="#0e1219"/>
  <text x="14" y="240" class="lbl">LIVE KNOBS  (always active)</text>

  <!-- Knob 1 VOLUME 85% -->
  <g transform="translate(70,278)">
    <circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/>
    <circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="96.1 150.8" transform="rotate(135)"/>
    <circle r="15" fill="#232a36"/>
    <text y="4" text-anchor="middle" class="txt" font-size="12" font-weight="700">85</text>
    <text y="32" text-anchor="middle" class="muted" font-size="10">VOLUME</text>
  </g>
  <!-- Knob 2 PAN center -->
  <g transform="translate(180,278)">
    <circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/>
    <circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="56.5 150.8" transform="rotate(135)"/>
    <circle r="15" fill="#232a36"/>
    <text y="4" text-anchor="middle" class="txt" font-size="11" font-weight="700">C</text>
    <text y="32" text-anchor="middle" class="muted" font-size="10">PAN</text>
  </g>
  <!-- Knob 3 PITCH +0 -->
  <g transform="translate(300,278)">
    <circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/>
    <circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="56.5 150.8" transform="rotate(135)"/>
    <circle r="15" fill="#232a36"/>
    <text y="4" text-anchor="middle" class="txt" font-size="11" font-weight="700">+0</text>
    <text y="32" text-anchor="middle" class="muted" font-size="10">PITCH</text>
  </g>
  <!-- Knob 4 REVERB 30% -->
  <g transform="translate(410,278)">
    <circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/>
    <circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="33.9 150.8" transform="rotate(135)"/>
    <circle r="15" fill="#232a36"/>
    <text y="4" text-anchor="middle" class="txt" font-size="12" font-weight="700">30</text>
    <text y="32" text-anchor="middle" class="muted" font-size="10">REVERB</text>
  </g>
</svg>
