        <g transform="translate(145,352)"><circle r="18" fill="none" stroke="#2d3543" stroke-width="4" stroke-linecap="round" stroke-dasharray="84.8 28.3" transform="rotate(135)"/><circle r="11" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">40</text><text y="32" text-anchor="middle" class="kl">DEPTH</text></g>
