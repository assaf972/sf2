<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 480 320" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .scr { fill:#0b0e13; } .txt { fill:#e6edf3; } .muted { fill:#7f8b9b; }
      .accent { fill:#4cc2ff; } .lbl { fill:#7f8b9b; font-size:9px; letter-spacing:.5px; }
      .btn { fill:#232a36; stroke:#323b4a; }
      .kv { fill:#e6edf3; font-size:11px; font-weight:700; } .kl { fill:#9aa6b6; font-size:9px; }
      .mono{font-family:monospace}
    </style>
  </defs>
  <rect x="0" y="0" width="480" height="320" rx="10" fill="#000"/>
  <rect x="4" y="4" width="472" height="312" rx="7" class="scr"/>

  <rect x="4" y="4" width="472" height="26" rx="7" fill="#11151c"/><rect x="4" y="16" width="472" height="14" fill="#11151c"/>
  <text x="14" y="22" class="accent" font-size="13" font-weight="700">GIGSYNTH</text>
  <text x="468" y="21" text-anchor="end" class="muted" font-size="10">DRUMMING</text>

  <!-- Kit + preset -->
  <rect x="12" y="38" width="456" height="40" rx="8" fill="#0e1b24" stroke="#4cc2ff"/>
  <text x="24" y="56" class="lbl">DRUM KIT</text>
  <text x="24" y="72" class="accent" font-size="13" font-weight="700">Studio Maple — drums.sf2</text>
  <rect x="320" y="46" width="138" height="26" rx="6" fill="#143040" stroke="#4cc2ff"/>
  <text x="389" y="63" text-anchor="middle" class="accent" font-size="11">Roland TD ▾</text>

  <!-- last hit / velocity -->
  <rect x="12" y="86" width="456" height="34" rx="8" fill="#161b23" stroke="#2b3340"/>
  <text x="24" y="106" class="lbl">LAST HIT · SNARE</text>
  <g transform="translate(150,97)">
    <rect x="0" y="0" width="250" height="12" rx="3" fill="#0b0e13" stroke="#323b4a"/>
    <rect x="3" y="2" width="160" height="8" rx="2" fill="#27c93f"/>
  </g>
  <text x="456" y="106" text-anchor="end" class="muted" font-size="9">vel 96</text>

  <!-- compact mapping (3 cols) -->
  <rect x="12" y="128" width="456" height="100" rx="8" fill="#11161e" stroke="#2b3340"/>
  <text x="24" y="146" class="lbl">MIDI MAP (Roland TD)</text>
  <g font-size="11" class="txt">
    <text x="24" y="168">Kick</text><text x="150" y="168" text-anchor="end" class="accent mono">36</text>
    <text x="24" y="188">Snare</text><text x="150" y="188" text-anchor="end" class="accent mono">38</text>
    <text x="24" y="208">Snare Rim</text><text x="150" y="208" text-anchor="end" class="accent mono">40</text>
    <text x="172" y="168">HH Closed</text><text x="300" y="168" text-anchor="end" class="accent mono">42</text>
    <text x="172" y="188">HH Open</text><text x="300" y="188" text-anchor="end" class="accent mono">46</text>
    <text x="172" y="208">HH Pedal</text><text x="300" y="208" text-anchor="end" class="accent mono">44</text>
    <text x="322" y="168">Crash 1</text><text x="456" y="168" text-anchor="end" class="accent mono">49</text>
    <text x="322" y="188">Ride</text><text x="456" y="188" text-anchor="end" class="accent mono">51</text>
    <text x="322" y="208">Tom 1/2/3</text><text x="456" y="208" text-anchor="end" class="accent mono">48/45/43</text>
  </g>

  <!-- MP3 transport -->
  <rect x="12" y="236" width="456" height="52" rx="8" fill="#161b23" stroke="#2b3340"/>
  <g transform="translate(40,262)"><circle r="18" fill="#143040" stroke="#4cc2ff"/><polygon points="-6,-9 -6,9 10,0" fill="#4cc2ff"/></g>
  <g transform="translate(92,262)"><circle r="16" class="btn"/><rect x="-5" y="-6" width="10" height="12" rx="2" fill="#cdd7e2"/></g>
  <g transform="translate(142,262)"><circle r="16" fill="#143040" stroke="#4cc2ff"/><path d="M -7 -3 a 7 7 0 1 1 -1 6" fill="none" stroke="#4cc2ff" stroke-width="2"/></g>
  <text x="40" y="248" text-anchor="middle" class="kl">PLAY</text><text x="92" y="248" text-anchor="middle" class="kl">STOP</text><text x="142" y="248" text-anchor="middle" class="accent" font-size="9">LOOP</text>
  <rect x="180" y="256" width="220" height="10" rx="5" fill="#0b0e13" stroke="#323b4a"/>
  <rect x="180" y="256" width="90" height="10" rx="5" fill="#4cc2ff"/>
  <text x="180" y="282" class="muted mono" font-size="9">Funk Groove 96 BPM</text>
  <text x="456" y="282" text-anchor="end" class="muted mono" font-size="9">01:12 / 02:48</text>

  <rect class="btn" x="12" y="296" width="120" height="18" rx="6"/><text x="72" y="309" text-anchor="middle" class="txt" font-size="9">◀ Back / Home</text>
  <text x="468" y="309" text-anchor="end" class="muted" font-size="9">drum channel 10 · velocity-sensitive</text>
</svg>
