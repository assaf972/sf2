<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 480 320" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .scr { fill:#0b0e13; } .txt { fill:#e6edf3; } .muted { fill:#7f8b9b; }
      .accent { fill:#4cc2ff; } .lbl { fill:#7f8b9b; font-size:9px; letter-spacing:.5px; }
      .btn { fill:#232a36; stroke:#323b4a; }
    </style>
  </defs>
  <rect x="0" y="0" width="480" height="320" rx="10" fill="#000"/>
  <rect x="4" y="4" width="472" height="312" rx="7" class="scr"/>

  <rect x="4" y="4" width="472" height="26" rx="7" fill="#11151c"/>
  <rect x="4" y="16" width="472" height="14" fill="#11151c"/>
  <text x="14" y="22" class="accent" font-size="13" font-weight="700">GIGSYNTH</text>
  <text x="468" y="21" text-anchor="end" class="muted" font-size="10">LIVE  ·  Part 3 / 7</text>

  <!-- current sound banner -->
  <rect x="12" y="38" width="456" height="50" rx="8" fill="#161b23" stroke="#2b3340"/>
  <text x="24" y="58" class="lbl">NOW PLAYING — KEYBOARD 1</text>
  <text x="24" y="80" class="accent" font-size="20" font-weight="700">Solina Pad</text>
  <text x="456" y="72" text-anchor="end" class="muted" font-size="11">Shine On You Crazy Diamond</text>

  <!-- 4 big knobs -->
  <g transform="translate(70,168)">
    <circle r="40" fill="none" stroke="#2d3543" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5 62.8" transform="rotate(135)"/>
    <circle r="40" fill="none" stroke="#4cc2ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="160 251.3" transform="rotate(135)"/>
    <circle r="26" fill="#232a36"/>
    <text y="2" text-anchor="middle" class="txt" font-size="20" font-weight="700">85</text>
    <text y="18" text-anchor="middle" class="muted" font-size="9">of 127</text>
    <text y="62" text-anchor="middle" class="txt" font-size="12">VOLUME</text>
  </g>
  <g transform="translate(180,168)">
    <circle r="40" fill="none" stroke="#2d3543" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5 62.8" transform="rotate(135)"/>
    <circle r="40" fill="none" stroke="#4cc2ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="94 251.3" transform="rotate(135)"/>
    <circle r="26" fill="#232a36"/>
    <text y="2" text-anchor="middle" class="txt" font-size="18" font-weight="700">C</text>
    <text y="18" text-anchor="middle" class="muted" font-size="9">center</text>
    <text y="62" text-anchor="middle" class="txt" font-size="12">PAN</text>
  </g>
  <g transform="translate(300,168)">
    <circle r="40" fill="none" stroke="#2d3543" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5 62.8" transform="rotate(135)"/>
    <circle r="40" fill="none" stroke="#4cc2ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="94 251.3" transform="rotate(135)"/>
    <circle r="26" fill="#232a36"/>
    <text y="2" text-anchor="middle" class="txt" font-size="18" font-weight="700">+0</text>
    <text y="18" text-anchor="middle" class="muted" font-size="9">±st</text>
    <text y="62" text-anchor="middle" class="txt" font-size="12">PITCH</text>
  </g>
  <g transform="translate(410,168)">
    <circle r="40" fill="none" stroke="#2d3543" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5 62.8" transform="rotate(135)"/>
    <circle r="40" fill="none" stroke="#4cc2ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="56 251.3" transform="rotate(135)"/>
    <circle r="26" fill="#232a36"/>
    <text y="2" text-anchor="middle" class="txt" font-size="20" font-weight="700">30</text>
    <text y="18" text-anchor="middle" class="muted" font-size="9">of 127</text>
    <text y="62" text-anchor="middle" class="txt" font-size="12">REVERB</text>
  </g>

  <!-- footer nav -->
  <line x1="12" y1="252" x2="468" y2="252" stroke="#2b3340"/>
  <g font-size="12">
    <rect class="btn" x="12"  y="266" width="146" height="38" rx="6"/>
    <text x="85"  y="290" text-anchor="middle" class="txt">◀  Prev Part</text>
    <rect class="btn" x="167" y="266" width="146" height="38" rx="6"/>
    <text x="240" y="290" text-anchor="middle" class="txt">Home / Menu</text>
    <rect class="btn" x="322" y="266" width="146" height="38" rx="6"/>
    <text x="395" y="290" text-anchor="middle" class="txt">Next Part  ▶</text>
  </g>
</svg>
