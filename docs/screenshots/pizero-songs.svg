<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 480 320" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .scr { fill:#0b0e13; } .txt { fill:#e6edf3; } .muted { fill:#7f8b9b; }
      .accent { fill:#4cc2ff; } .lbl { fill:#7f8b9b; font-size:9px; letter-spacing:.5px; }
      .btn { fill:#232a36; stroke:#323b4a; } .btnA { fill:#143040; stroke:#4cc2ff; }
    </style>
  </defs>
  <rect x="0" y="0" width="480" height="320" rx="10" fill="#000"/>
  <rect x="4" y="4" width="472" height="312" rx="7" class="scr"/>

  <rect x="4" y="4" width="472" height="26" rx="7" fill="#11151c"/>
  <rect x="4" y="16" width="472" height="14" fill="#11151c"/>
  <text x="14" y="22" class="accent" font-size="13" font-weight="700">GIGSYNTH</text>
  <text x="468" y="21" text-anchor="end" class="muted" font-size="10">SONGS  ▸  turn knob to scroll · press to open</text>

  <!-- ROW 1 : SONGS -->
  <text x="14" y="48" class="lbl">SONGS</text>
  <g font-size="12" transform="translate(0,54)">
    <rect class="btn"  x="12"  y="0" width="150" height="34" rx="6"/>
    <text x="24"  y="22" class="txt">Comfortably Numb</text>
    <rect class="btnA" x="170" y="0" width="150" height="34" rx="6"/>
    <text x="182" y="22" class="accent" font-weight="700">Shine On You…</text>
    <rect class="btn"  x="328" y="0" width="140" height="34" rx="6"/>
    <text x="340" y="22" class="txt">Any Colour…</text>
    <!-- scroll hint -->
    <text x="468" y="22" text-anchor="end" class="muted" font-size="14">›</text>
  </g>

  <!-- ROW 2 : PARTS of selected song -->
  <text x="14" y="118" class="lbl">PARTS · SHINE ON YOU CRAZY DIAMOND</text>
  <g font-size="11" transform="translate(0,124)">
    <rect class="btn"  x="12"  y="0" width="86" height="34" rx="6"/>
    <text x="55"  y="16" text-anchor="middle" class="muted" font-size="9">1</text>
    <text x="55"  y="28" text-anchor="middle" class="txt" font-size="10">Intro</text>
    <rect class="btn"  x="104" y="0" width="86" height="34" rx="6"/>
    <text x="147" y="16" text-anchor="middle" class="muted" font-size="9">2</text>
    <text x="147" y="28" text-anchor="middle" class="txt" font-size="10">Glass Pad</text>
    <rect class="btnA" x="196" y="0" width="86" height="34" rx="6"/>
    <text x="239" y="16" text-anchor="middle" class="muted" font-size="9">3</text>
    <text x="239" y="28" text-anchor="middle" class="accent" font-size="10" font-weight="700">Solina Pad</text>
    <rect class="btn"  x="288" y="0" width="86" height="34" rx="6"/>
    <text x="331" y="16" text-anchor="middle" class="muted" font-size="9">4</text>
    <text x="331" y="28" text-anchor="middle" class="txt" font-size="10">Horn Solo</text>
    <rect class="btn"  x="380" y="0" width="86" height="34" rx="6"/>
    <text x="423" y="16" text-anchor="middle" class="muted" font-size="9">5</text>
    <text x="423" y="28" text-anchor="middle" class="txt" font-size="10">Rhodes</text>
  </g>

  <text x="14" y="190" class="muted" font-size="10">Selecting a part instantly recalls its sounds, volumes, pitch &amp; routing.</text>

  <!-- back button -->
  <rect class="btn" x="12" y="198" width="120" height="26" rx="6"/>
  <text x="72" y="215" text-anchor="middle" class="txt" font-size="11">◀ Back / Home</text>

  <!-- knob row (same as home) -->
  <rect x="4" y="226" width="472" height="90" rx="7" fill="#0e1219"/>
  <text x="14" y="240" class="lbl">LIVE KNOBS  (always active)</text>
  <g transform="translate(70,278)"><circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/><circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="96.1 150.8" transform="rotate(135)"/><circle r="15" fill="#232a36"/><text y="4" text-anchor="middle" class="txt" font-size="12" font-weight="700">85</text><text y="32" text-anchor="middle" class="muted" font-size="10">VOLUME</text></g>
  <g transform="translate(180,278)"><circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/><circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="56.5 150.8" transform="rotate(135)"/><circle r="15" fill="#232a36"/><text y="4" text-anchor="middle" class="txt" font-size="11" font-weight="700">C</text><text y="32" text-anchor="middle" class="muted" font-size="10">PAN</text></g>
  <g transform="translate(300,278)"><circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/><circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="56.5 150.8" transform="rotate(135)"/><circle r="15" fill="#232a36"/><text y="4" text-anchor="middle" class="txt" font-size="11" font-weight="700">+0</text><text y="32" text-anchor="middle" class="muted" font-size="10">PITCH</text></g>
  <g transform="translate(410,278)"><circle r="24" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="113.1 37.7" transform="rotate(135)"/><circle r="24" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="33.9 150.8" transform="rotate(135)"/><circle r="15" fill="#232a36"/><text y="4" text-anchor="middle" class="txt" font-size="12" font-weight="700">30</text><text y="32" text-anchor="middle" class="muted" font-size="10">REVERB</text></g>
</svg>
