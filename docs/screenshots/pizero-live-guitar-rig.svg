<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 480 320" font-family="'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .scr { fill:#0b0e13; } .txt { fill:#e6edf3; } .muted { fill:#7f8b9b; }
      .accent { fill:#4cc2ff; } .lbl { fill:#7f8b9b; font-size:9px; letter-spacing:.5px; }
      .btn { fill:#232a36; stroke:#323b4a; }
      .kv { fill:#e6edf3; font-size:11px; font-weight:700; } .kl { fill:#9aa6b6; font-size:9px; }
      .mono{font-family:monospace}
    </style>
  </defs>
  <rect x="0" y="0" width="480" height="320" rx="10" fill="#000"/>
  <rect x="4" y="4" width="472" height="312" rx="7" class="scr"/>

  <rect x="4" y="4" width="472" height="26" rx="7" fill="#11151c"/><rect x="4" y="16" width="472" height="14" fill="#11151c"/>
  <text x="14" y="22" class="accent" font-size="13" font-weight="700">GIGSYNTH</text>
  <text x="468" y="21" text-anchor="end" class="muted" font-size="10">LIVE GUITAR · Lead</text>

  <!-- input meter -->
  <rect x="12" y="38" width="456" height="30" rx="8" fill="#161b23" stroke="#2b3340"/>
  <text x="24" y="57" class="lbl">IN</text>
  <g transform="translate(48,47)">
    <rect x="0" y="0" width="300" height="12" rx="3" fill="#0b0e13" stroke="#323b4a"/>
    <rect x="3" y="2" width="190" height="8" rx="2" fill="#27c93f"/>
    <rect x="196" y="2" width="34" height="8" rx="2" fill="#ffbd2e"/>
  </g>
  <text x="456" y="57" text-anchor="end" class="muted" font-size="9">-9 dB</text>

  <!-- 4 effect slots -->
  <g transform="translate(12,76)">
    <rect x="0" y="0" width="110" height="46" rx="8" fill="#143040" stroke="#4cc2ff"/>
    <circle cx="16" cy="16" r="5" fill="#4cc2ff"/><text x="28" y="20" class="accent" font-size="11" font-weight="700">FUZZ</text><text x="14" y="38" class="kl">slot 1</text>
    <rect x="118" y="0" width="110" height="46" rx="8" fill="#0e1b24" stroke="#4cc2ff" stroke-width="2"/>
    <circle cx="134" cy="16" r="5" fill="#4cc2ff"/><text x="146" y="20" class="accent" font-size="11" font-weight="700">O.DRIVE</text><text x="132" y="38" class="accent" font-size="9">◀ encoders</text>
    <rect x="236" y="0" width="110" height="46" rx="8" class="btn"/>
    <circle cx="252" cy="16" r="5" fill="#5a6678"/><text x="264" y="20" class="muted" font-size="11" font-weight="700">DIST</text><text x="250" y="38" class="kl">off</text>
    <rect x="354" y="0" width="102" height="46" rx="8" fill="#143040" stroke="#4cc2ff"/>
    <circle cx="370" cy="16" r="5" fill="#4cc2ff"/><text x="382" y="20" class="accent" font-size="11" font-weight="700">MOD</text><text x="368" y="38" class="kl">slot 4</text>
  </g>

  <!-- amp/cab -->
  <g transform="translate(12,130)">
    <rect x="0" y="0" width="222" height="34" rx="8" fill="#11161e" stroke="#2b3340"/>
    <text x="12" y="15" class="lbl">AMP (.nam)</text><text x="12" y="29" class="accent" font-size="11" font-weight="700">Tweed Deluxe</text>
    <rect x="234" y="0" width="222" height="34" rx="8" fill="#11161e" stroke="#2b3340"/>
    <text x="246" y="15" class="lbl">CAB IR (.wav)</text><text x="246" y="29" class="accent" font-size="11" font-weight="700">4x12 V30</text>
  </g>

  <!-- four always-live encoders mapped to focused slot -->
  <g transform="translate(64,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="64 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">6.5</text><text y="34" text-anchor="middle" class="kl">DRIVE</text></g>
  <g transform="translate(178,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="78 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">65</text><text y="34" text-anchor="middle" class="kl">TONE</text></g>
  <g transform="translate(292,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="74 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">70</text><text y="34" text-anchor="middle" class="kl">LEVEL</text></g>
  <g transform="translate(406,212)"><circle r="22" fill="none" stroke="#2d3543" stroke-width="5" stroke-linecap="round" stroke-dasharray="103.7 34.6" transform="rotate(135)"/><circle r="22" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="48 138.2" transform="rotate(135)"/><circle r="13" fill="#232a36"/><text y="3" text-anchor="middle" class="kv">35</text><text y="34" text-anchor="middle" class="kl">MIX</text></g>

  <!-- MP3 strip with pitch + remove guitar -->
  <rect x="12" y="256" width="456" height="34" rx="8" fill="#161b23" stroke="#2b3340"/>
  <g transform="translate(36,273)"><circle r="14" fill="#143040" stroke="#4cc2ff"/><polygon points="-5,-7 -5,7 8,0" fill="#4cc2ff"/></g>
  <g transform="translate(78,273)"><circle r="13" fill="#143040" stroke="#4cc2ff"/><path d="M -6 -3 a 6 6 0 1 1 -1 5" fill="none" stroke="#4cc2ff" stroke-width="2"/></g>
  <rect x="104" y="268" width="150" height="10" rx="5" fill="#0b0e13" stroke="#323b4a"/><rect x="104" y="268" width="60" height="10" rx="5" fill="#4cc2ff"/>
  <rect x="266" y="263" width="86" height="22" rx="6" fill="#143040" stroke="#4cc2ff"/><text x="309" y="278" text-anchor="middle" class="accent" font-size="10">PITCH −2</text>
  <rect x="360" y="263" width="96" height="22" rx="6" fill="#143040" stroke="#4cc2ff"/><circle cx="372" cy="274" r="5" fill="#4cc2ff"/><text x="408" y="278" text-anchor="middle" class="accent" font-size="9">NO GTR</text>

  <rect class="btn" x="12" y="296" width="120" height="18" rx="6"/><text x="72" y="309" text-anchor="middle" class="txt" font-size="9">◀ Back / Home</text>
  <text x="468" y="309" text-anchor="end" class="muted" font-size="9">encoders address the focused slot</text>
</svg>
