<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/><stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <style>
      .panel{fill:#1a1f29;stroke:#2b3340;stroke-width:1}
      .txt{fill:#e6edf3}.muted{fill:#8b97a7}.accent{fill:#4cc2ff}
      .lbl{fill:#8b97a7;font-size:12px}.num{fill:#4cc2ff;font-size:13px;font-weight:600}
    </style>
  </defs>
  <rect width="1000" height="120" fill="url(#bg)"/>

  <!-- Top bar (same panel style as desktop-live) -->
  <g transform="translate(24,34)">
    <rect class="panel" x="0" y="0" width="952" height="52" rx="8"/>
    <text x="18" y="22" class="lbl">SOUNDFONT</text>
    <text x="18" y="40" class="txt" font-size="14">GrandPianos.sf2</text>

    <text x="240" y="22" class="lbl">MASTER</text>
    <rect x="240" y="30" width="240" height="6" rx="3" fill="#2d3543"/>
    <rect x="240" y="30" width="149" height="6" rx="3" fill="#4cc2ff"/>
    <circle cx="389" cy="33" r="9" fill="#e6edf3"/>
    <text x="498" y="38" class="num">0.62</text>

    <!-- REC toggle (armed / active) -->
    <rect x="600" y="10" width="200" height="32" rx="16" fill="#3a1414" stroke="#b3261e" stroke-width="1.5"/>
    <circle cx="624" cy="26" r="6" fill="#ff5f56"/>
    <text x="644" y="31" fill="#ff8a8a" font-size="14" font-weight="700">REC</text>
    <text x="690" y="31" fill="#ff8a8a" font-size="13">armed · 00:42</text>

    <!-- PANIC -->
    <rect x="816" y="10" width="120" height="32" rx="6" fill="#b3261e"/>
    <text x="876" y="31" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">PANIC</text>
  </g>
</svg>
