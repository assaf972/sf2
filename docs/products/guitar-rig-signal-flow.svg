<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/><stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4cc2ff"/>
    </marker>
    <style>
      .panel{fill:#1a1f29;stroke:#2b3340;stroke-width:1}
      .box{fill:#232a36;stroke:#323b4a;stroke-width:1.5}
      .boxc{fill:#0e1b24;stroke:#4cc2ff;stroke-width:1.5}
      .txt{fill:#e6edf3}.muted{fill:#8b97a7}.accent{fill:#4cc2ff}
      .bt{fill:#e6edf3;font-size:14px;font-weight:700}
      .bs{fill:#8b97a7;font-size:10px}
      .ann{fill:#4cc2ff;font-size:9px}
      .h{fill:#cdd7e2;font-size:16px;font-weight:600}
      .lbl{fill:#8b97a7;font-size:12px;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="420" fill="url(#bg)"/>

  <!-- panel background -->
  <rect class="panel" x="20" y="20" width="1060" height="380" rx="14"/>
  <text x="44" y="54" class="h">Guitar / Bass Rig — Signal Flow</text>
  <text x="44" y="76" class="lbl">¼″ instrument in → DSP chain → output · open-source: NAM, Guitarix, cabinet IRs</text>
  <line x1="44" y1="92" x2="1056" y2="92" stroke="#2b3340"/>

  <!-- connector lines (drawn first, behind boxes) -->
  <g stroke="#4cc2ff" stroke-width="2" fill="none">
    <line x1="158" y1="190" x2="186" y2="190" marker-end="url(#arrow)"/>
    <line x1="290" y1="190" x2="318" y2="190" marker-end="url(#arrow)"/>
    <line x1="422" y1="190" x2="450" y2="190" marker-end="url(#arrow)"/>
    <line x1="582" y1="190" x2="610" y2="190" marker-end="url(#arrow)"/>
    <line x1="742" y1="190" x2="770" y2="190" marker-end="url(#arrow)"/>
    <line x1="874" y1="190" x2="902" y2="190" marker-end="url(#arrow)"/>
    <line x1="1006" y1="190" x2="1018" y2="190" marker-end="url(#arrow)"/>
  </g>

  <!-- 1 Guitar/Bass IN -->
  <g transform="translate(44,150)">
    <rect class="box" x="0" y="0" width="114" height="80" rx="10"/>
    <text x="57" y="34" text-anchor="middle" class="bt">Guitar /</text>
    <text x="57" y="52" text-anchor="middle" class="bt">Bass IN</text>
    <text x="57" y="70" text-anchor="middle" class="bs">¼″ TS jack</text>
  </g>

  <!-- 2 ADC -->
  <g transform="translate(186,150)">
    <rect class="box" x="0" y="0" width="104" height="80" rx="10"/>
    <text x="52" y="44" text-anchor="middle" class="bt">ADC</text>
    <text x="52" y="64" text-anchor="middle" class="bs">48 kHz in</text>
  </g>

  <!-- 3 Gate -->
  <g transform="translate(318,150)">
    <rect class="box" x="0" y="0" width="104" height="80" rx="10"/>
    <text x="52" y="38" text-anchor="middle" class="bt">Gate</text>
    <text x="52" y="56" text-anchor="middle" class="bs">+ in gain</text>
    <text x="52" y="70" text-anchor="middle" class="bs">noise gate</text>
  </g>

  <!-- 4 Amp (NAM) highlighted -->
  <g transform="translate(450,140)">
    <rect class="boxc" x="0" y="0" width="132" height="100" rx="10"/>
    <text x="66" y="40" text-anchor="middle" class="accent" font-size="14" font-weight="700">Amp</text>
    <text x="66" y="60" text-anchor="middle" class="bs">[NAM model]</text>
    <text x="66" y="84" text-anchor="middle" class="ann">Neural Amp Modeler (.nam)</text>
  </g>

  <!-- 5 Cab IR highlighted -->
  <g transform="translate(610,140)">
    <rect class="boxc" x="0" y="0" width="132" height="100" rx="10"/>
    <text x="66" y="40" text-anchor="middle" class="accent" font-size="14" font-weight="700">Cab IR</text>
    <text x="66" y="60" text-anchor="middle" class="bs">convolution</text>
    <text x="66" y="84" text-anchor="middle" class="ann">impulse response (.wav)</text>
  </g>

  <!-- 6 EQ -->
  <g transform="translate(770,150)">
    <rect class="box" x="0" y="0" width="104" height="80" rx="10"/>
    <text x="52" y="38" text-anchor="middle" class="bt">EQ</text>
    <text x="52" y="56" text-anchor="middle" class="bs">3-band</text>
    <text x="52" y="70" text-anchor="middle" class="bs">voicing</text>
  </g>

  <!-- 7 FX -->
  <g transform="translate(902,150)">
    <rect class="box" x="0" y="0" width="104" height="80" rx="10"/>
    <text x="52" y="34" text-anchor="middle" class="bt">FX</text>
    <text x="52" y="52" text-anchor="middle" class="bs">Chorus·Delay</text>
    <text x="52" y="66" text-anchor="middle" class="bs">Phaser·Flanger</text>
  </g>

  <!-- 8 Out -->
  <g transform="translate(1018,150)">
    <rect class="box" x="0" y="0" width="38" height="80" rx="10"/>
    <text x="19" y="195" text-anchor="middle" class="bt" transform="translate(0,-150)">Out</text>
  </g>

  <!-- Bass DI blend note -->
  <g transform="translate(450,290)">
    <rect x="0" y="0" width="292" height="56" rx="10" fill="#161b23" stroke="#323b4a"/>
    <circle cx="22" cy="28" r="6" fill="#27c93f"/>
    <text x="40" y="25" class="txt" font-size="12" font-weight="600">Bass mode</text>
    <text x="40" y="43" class="muted" font-size="10">adds parallel DI blend around the amp stage</text>
  </g>
  <line x1="516" y1="240" x2="516" y2="290" stroke="#27c93f" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
