<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="chassisE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3543"/>
      <stop offset="0.5" stop-color="#232a36"/>
      <stop offset="1" stop-color="#1a1f29"/>
    </linearGradient>
    <linearGradient id="panelE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a36"/>
      <stop offset="1" stop-color="#161b23"/>
    </linearGradient>
    <linearGradient id="pcbE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a2a"/>
      <stop offset="1" stop-color="#0f2a1f"/>
    </linearGradient>
    <linearGradient id="screenE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <radialGradient id="screenglowE" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="560" fill="url(#bgE)"/>

  <text x="40" y="44" fill="#e6edf3" font-size="24" font-weight="600">Embedded Pi retrofit concept</text>
  <text x="40" y="66" fill="#8b97a7" font-size="13">Generic USB MIDI controller with the drum-pad zone replaced by a Pi + touchscreen module</text>

  <!-- Controller chassis -->
  <rect x="60" y="100" width="980" height="300" rx="14" fill="url(#chassisE)" stroke="#3a4452" stroke-width="2"/>
  <rect x="78" y="116" width="600" height="160" rx="8" fill="url(#panelE)" stroke="#323b4a"/>

  <!-- Left: knobs + sliders + small pads -->
  <!-- sliders -->
  <g>
    <text x="98" y="136" fill="#8b97a7" font-size="9">FADERS</text>
    <g fill="#232a36">
      <rect x="100" y="144" width="6" height="70" rx="3"/>
      <rect x="130" y="144" width="6" height="70" rx="3"/>
      <rect x="160" y="144" width="6" height="70" rx="3"/>
      <rect x="190" y="144" width="6" height="70" rx="3"/>
    </g>
    <g fill="#2d3543" stroke="#4cc2ff" stroke-width="0.8">
      <rect x="94" y="160" width="18" height="11" rx="3"/>
      <rect x="124" y="184" width="18" height="11" rx="3"/>
      <rect x="154" y="172" width="18" height="11" rx="3"/>
      <rect x="184" y="196" width="18" height="11" rx="3"/>
    </g>
  </g>
  <!-- knobs -->
  <g>
    <text x="240" y="136" fill="#8b97a7" font-size="9">KNOBS</text>
    <g><circle cx="262" cy="170" r="18" fill="#2d3543" stroke="#3a4452" stroke-width="1.5"/><line x1="262" y1="170" x2="262" y2="156" stroke="#4cc2ff" stroke-width="2" stroke-linecap="round"/></g>
    <g><circle cx="312" cy="170" r="18" fill="#2d3543" stroke="#3a4452" stroke-width="1.5"/><line x1="312" y1="170" x2="324" y2="161" stroke="#4cc2ff" stroke-width="2" stroke-linecap="round"/></g>
    <g><circle cx="262" cy="218" r="14" fill="#2d3543" stroke="#3a4452" stroke-width="1.5"/><line x1="262" y1="218" x2="262" y2="206" stroke="#4cc2ff" stroke-width="2" stroke-linecap="round"/></g>
    <g><circle cx="312" cy="218" r="14" fill="#2d3543" stroke="#3a4452" stroke-width="1.5"/><line x1="312" y1="218" x2="322" y2="210" stroke="#4cc2ff" stroke-width="2" stroke-linecap="round"/></g>
  </g>
  <!-- small pads (remaining) -->
  <g>
    <text x="380" y="136" fill="#8b97a7" font-size="9">PADS</text>
    <g fill="#161b23" stroke="#3a4452">
      <rect x="380" y="144" width="40" height="40" rx="5"/>
      <rect x="430" y="144" width="40" height="40" rx="5"/>
      <rect x="480" y="144" width="40" height="40" rx="5"/>
      <rect x="380" y="194" width="40" height="40" rx="5"/>
      <rect x="430" y="194" width="40" height="40" rx="5"/>
      <rect x="480" y="194" width="40" height="40" rx="5"/>
    </g>
    <rect x="380" y="144" width="40" height="40" rx="5" fill="#4cc2ff" fill-opacity="0.12" stroke="#4cc2ff" stroke-opacity="0.5"/>
  </g>

  <!-- transport -->
  <g fill="#2d3543" stroke="#3a4452">
    <rect x="98" y="232" width="34" height="20" rx="4"/>
    <rect x="140" y="232" width="34" height="20" rx="4"/>
  </g>

  <!-- RIGHT: drum-pad zone REPLACED by Pi + touchscreen (cutaway) -->
  <!-- dashed "old drum pad zone" outline -->
  <rect x="700" y="116" width="318" height="160" rx="8" fill="#11151c" stroke="#3a4452" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="708" y="134" fill="#8b97a7" font-size="9">former 4×4 drum-pad area</text>

  <!-- exploded: touchscreen (front face) lifted up -->
  <g>
    <rect x="724" y="146" width="270" height="92" rx="6" fill="#0b0e13" stroke="#3a4452" stroke-width="2"/>
    <rect x="730" y="152" width="258" height="80" rx="4" fill="url(#screenE)"/>
    <rect x="730" y="152" width="258" height="80" rx="4" fill="url(#screenglowE)"/>
    <rect x="730" y="152" width="258" height="20" rx="4" fill="#4cc2ff"/>
    <text x="740" y="167" fill="#0b0e13" font-size="11" font-weight="700">GIGSYNTH</text>
    <text x="978" y="167" fill="#0b0e13" font-size="8" text-anchor="end">RETROFIT</text>
    <circle cx="766" cy="202" r="14" fill="none" stroke="#2d3543" stroke-width="5"/>
    <path d="M 766 188 A 14 14 0 1 1 754 209" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round"/>
    <rect x="800" y="184" width="178" height="40" rx="4" fill="#161b23" stroke="#2d3543"/>
    <text x="810" y="200" fill="#e6edf3" font-size="11" font-weight="600">Synth Lead</text>
    <text x="810" y="216" fill="#8b97a7" font-size="9">Part A · live</text>
  </g>

  <!-- DSI ribbon cable from screen down to Pi board -->
  <g>
    <path d="M 800 238 q 0 30 -40 40 q -40 12 -40 40" fill="none" stroke="#4cc2ff" stroke-width="2" stroke-opacity="0.7"/>
    <rect x="788" y="238" width="24" height="8" rx="2" fill="#2d3543" stroke="#3a4452"/>
  </g>

  <!-- Pi board (exploded, below/behind, cutaway) -->
  <g>
    <rect x="640" y="300" width="200" height="88" rx="6" fill="url(#pcbE)" stroke="#27c93f" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="650" y="318" fill="#9fe6b8" font-size="10" font-weight="600">Raspberry Pi 5</text>
    <!-- SoC chip -->
    <rect x="700" y="330" width="44" height="40" rx="3" fill="#0f2419" stroke="#27c93f" stroke-opacity="0.4"/>
    <text x="722" y="354" fill="#9fe6b8" font-size="8" text-anchor="middle">SoC</text>
    <!-- usb ports -->
    <rect x="816" y="330" width="20" height="14" rx="2" fill="#161b23" stroke="#3a4452"/>
    <rect x="816" y="350" width="20" height="14" rx="2" fill="#161b23" stroke="#3a4452"/>
    <!-- gpio header -->
    <g fill="#3a4452"><rect x="650" y="332" width="40" height="6"/><rect x="650" y="342" width="40" height="6"/></g>
    <!-- DSI connector -->
    <rect x="760" y="372" width="40" height="8" rx="2" fill="#2d3543" stroke="#4cc2ff" stroke-opacity="0.6"/>
    <text x="780" y="395" fill="#8b97a7" font-size="8" text-anchor="middle">DSI</text>
  </g>

  <!-- 25 mini keys hint at bottom -->
  <g>
    <rect x="78" y="290" width="600" height="96" rx="4" fill="#0b0e13" stroke="#2d3543"/>
    <g fill="#e9edf2" stroke="#c4ccd6" stroke-width="0.8">
      <rect x="82" y="298" width="38" height="80" rx="2"/>
      <rect x="122" y="298" width="38" height="80" rx="2"/>
      <rect x="162" y="298" width="38" height="80" rx="2"/>
      <rect x="202" y="298" width="38" height="80" rx="2"/>
      <rect x="242" y="298" width="38" height="80" rx="2"/>
      <rect x="282" y="298" width="38" height="80" rx="2"/>
      <rect x="322" y="298" width="38" height="80" rx="2"/>
      <rect x="362" y="298" width="38" height="80" rx="2"/>
      <rect x="402" y="298" width="38" height="80" rx="2"/>
      <rect x="442" y="298" width="38" height="80" rx="2"/>
      <rect x="482" y="298" width="38" height="80" rx="2"/>
      <rect x="522" y="298" width="38" height="80" rx="2"/>
      <rect x="562" y="298" width="38" height="80" rx="2"/>
      <rect x="602" y="298" width="38" height="80" rx="2"/>
      <rect x="642" y="298" width="32" height="80" rx="2"/>
    </g>
    <g fill="#14181f">
      <rect x="110" y="298" width="20" height="50" rx="2"/>
      <rect x="152" y="298" width="20" height="50" rx="2"/>
      <rect x="232" y="298" width="20" height="50" rx="2"/>
      <rect x="272" y="298" width="20" height="50" rx="2"/>
      <rect x="312" y="298" width="20" height="50" rx="2"/>
      <rect x="390" y="298" width="20" height="50" rx="2"/>
      <rect x="432" y="298" width="20" height="50" rx="2"/>
      <rect x="512" y="298" width="20" height="50" rx="2"/>
      <rect x="552" y="298" width="20" height="50" rx="2"/>
      <rect x="592" y="298" width="20" height="50" rx="2"/>
    </g>
  </g>

  <circle cx="92" cy="124" r="4" fill="#27c93f"/>

  <!-- CALLOUTS -->
  <g stroke="#4cc2ff" stroke-width="1" fill="none">
    <path d="M 859 146 L 859 90 L 600 90"/>
    <path d="M 740 344 L 600 344 L 600 470 L 360 470"/>
    <path d="M 780 250 L 1040 250 L 1040 200"/>
    <path d="M 287 144 L 287 90 L 360 90"/>
    <path d="M 145 144 L 145 84 L 80 84"/>
    <path d="M 400 144 L 400 100 L 460 100"/>
  </g>
  <g fill="#8b97a7" font-size="11">
    <text x="596" y="94" text-anchor="end" fill="#4cc2ff">drum pads → 5″ / 7″ touchscreen + Raspberry Pi 5</text>
    <text x="356" y="474" text-anchor="end">Pi 5 board mounted behind panel (cutaway)</text>
    <text x="1044" y="196">DSI ribbon: screen → Pi</text>
    <text x="364" y="94">knobs</text>
    <text x="76" y="88" text-anchor="end">sliders</text>
    <text x="464" y="104">existing pads remain</text>
  </g>
</svg>
