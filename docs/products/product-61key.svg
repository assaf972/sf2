        <rect x="137" y="200" width="18" height="12" rx="3"/>
        <rect x="172" y="184" width="18" height="12" rx="3"/>
        <rect x="207" y="210" width="18" height="12" rx="3"/>
        <rect x="242" y="166" width="18" height="12" rx="3"/>
