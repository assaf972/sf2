        <rect x="143" y="156" width="6" height="80" rx="3"/>
        <rect x="178" y="156" width="6" height="80" rx="3"/>
        <rect x="213" y="156" width="6" height="80" rx="3"/>
        <rect x="248" y="156" width="6" height="80" rx="3"/>
