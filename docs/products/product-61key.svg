<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg61" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="chassis61" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3543"/>
      <stop offset="0.5" stop-color="#232a36"/>
      <stop offset="1" stop-color="#1a1f29"/>
    </linearGradient>
    <linearGradient id="panel61" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a36"/>
      <stop offset="1" stop-color="#161b23"/>
    </linearGradient>
    <linearGradient id="screen61" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="whitekey61" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <radialGradient id="screenglow61" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1300" height="560" fill="url(#bg61)"/>

  <text x="40" y="44" fill="#e6edf3" font-size="24" font-weight="600">GS-61 · 61-key · 7″ touch</text>
  <text x="40" y="66" fill="#8b97a7" font-size="13">61-key sound module · 8 knobs / 8 faders preset to control the app</text>

  <!-- Chassis -->
